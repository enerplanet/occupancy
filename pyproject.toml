[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy"
# Fork releases are git tags vX.Y.Z-enerplanet.N carrying the package
# version X.Y.Z+enerplanet.N; the version is set here by hand at release.
version = "6.1.0+enerplanet.1"
description = "Stochastic occupancy and residential electricity profile modeling for UU-BUEM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Somadutta Sahoo", email = "s.sahoo@uu.nl" },
]
keywords = ["occupancy", "building-energy", "stochastic-modeling", "UU-BUEM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
  "mypy>=1.8",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
]

[project.scripts]
occupancy = "occupancy.cli:main"

[project.urls]
Homepage = "https://github.com/UU-BUEM/occupancy"
Repository = "https://github.com/UU-BUEM/occupancy"
"Bug Tracker" = "https://github.com/UU-BUEM/occupancy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"occupancy.config" = ["data/*.json"]
"occupancy.households" = [
    "data/*.json",
    "data/*.csv",
    "data/archetypes/*.json",
]
"occupancy.services_buildings" = ["data/*/*.json"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["occupancy"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["occupancy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
